<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Changed – University Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />

    <style>
        /* ── CSS Variables (Light & Dark) ── */
        :root {
            --bg-primary: #f0f4fe;
            --text-primary: #0b1a33;
            --text-secondary: #2d4270;
            --text-muted: #5a6f94;
            --glass-bg: rgba(255, 255, 255, 0.60);
            --glass-border: 1px solid rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 20px 60px rgba(11, 30, 74, 0.06);
            --card-bg: rgba(255, 255, 255, 0.45);
            --btn-bg: linear-gradient(135deg, #1a3a8a, #2a5bc7);
            --btn-hover: linear-gradient(135deg, #2a5bc7, #4a7cf7);
            --btn-text: #fff;
            --link-color: #2a5bc7;
            --link-hover: #1a3a8a;
            --border-radius-card: 24px;
            --header-gradient: linear-gradient(135deg, #0b1e4a 0%, #1a3a8a 50%, #2a5bc7 100%);
            --header-text: #ffffff;
            --success-color: #16a34a;
            --success-bg: rgba(22, 163, 74, 0.08);
        }

        [data-theme="dark"] {
            --bg-primary: #0a1225;
            --text-primary: #e8edf9;
            --text-secondary: #b0c4e8;
            --text-muted: #7a8fb8;
            --glass-bg: rgba(22, 34, 64, 0.70);
            --glass-border: 1px solid rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 20px 60px rgba(0, 0, 0, 0.40);
            --card-bg: rgba(22, 34, 64, 0.40);
            --btn-bg: linear-gradient(135deg, #0f2248, #1a3570);
            --btn-hover: linear-gradient(135deg, #1a3570, #2a5bc7);
            --link-color: #5a8cf7;
            --link-hover: #7aa0ff;
            --header-gradient: linear-gradient(135deg, #070e1f 0%, #0f2248 50%, #1a3570 100%);
            --header-text: #e8edf9;
            --success-color: #4ade80;
            --success-bg: rgba(74, 222, 128, 0.08);
        }

        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            color: var(--text-primary);
            transition: background 0.5s ease, color 0.4s ease;
            padding: 0;
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* ── Animated Background ── */
        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-canvas .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.20;
            animation: floatOrb 22s ease-in-out infinite alternate;
        }

        .bg-canvas .gradient-orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #4a7cf7, #1a3a8a);
            top: -15%;
            left: -10%;
            animation-duration: 26s;
        }

        .bg-canvas .gradient-orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #7c4af7, #3a1a8a);
            bottom: -15%;
            right: -10%;
            animation-duration: 30s;
            animation-delay: -8s;
        }

        .bg-canvas .gradient-orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #f7b731, #f77a31);
            top: 40%;
            left: 60%;
            animation-duration: 24s;
            animation-delay: -4s;
            opacity: 0.10;
        }

        [data-theme="dark"] .bg-canvas .gradient-orb:nth-child(1) {
            opacity: 0.12;
            background: radial-gradient(circle, #2a5bc7, #0f2248);
        }
        [data-theme="dark"] .bg-canvas .gradient-orb:nth-child(2) {
            opacity: 0.10;
            background: radial-gradient(circle, #5a3bc7, #1a0f48);
        }
        [data-theme="dark"] .bg-canvas .gradient-orb:nth-child(3) {
            opacity: 0.06;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(50px, -30px) scale(1.05) rotate(5deg);
            }
            66% {
                transform: translate(-20px, 30px) scale(0.95) rotate(-3deg);
            }
            100% {
                transform: translate(30px, -10px) scale(1.02) rotate(2deg);
            }
        }

        .bg-canvas::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            pointer-events: none;
        }

        /* ── Header ── */
        .header {
            background: var(--header-gradient);
            color: var(--header-text);
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.5s ease;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 800;
            font-size: 1.2rem;
            letter-spacing: -0.4px;
        }

        .header-brand .logo-icon {
            font-size: 1.6rem;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.15));
        }

        .header-brand .badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            padding: 4px 16px;
            border-radius: 100px;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            padding: 5px 18px 5px 20px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .header-user .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd966, #f7b731);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: #0b1a33;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 100px;
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.3rem;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--header-text);
        }

        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.06) rotate(8deg);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .theme-toggle:active {
            transform: scale(0.92);
        }

        /* ── Main Container ── */
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 32px 24px 60px;
            animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── Glass Card ── */
        .success-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--glass-border);
            border-radius: var(--border-radius-card);
            box-shadow: var(--glass-shadow);
            padding: 44px 40px;
            text-align: center;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }

        .success-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--border-radius-card);
            background: radial-gradient(circle at 30% 20%, rgba(42, 91, 199, 0.04), transparent 60%);
            pointer-events: none;
        }

        .success-card:hover {
            box-shadow: 0 30px 80px rgba(11, 30, 74, 0.10);
            border-color: rgba(255, 255, 255, 0.6);
        }

        [data-theme="dark"] .success-card:hover {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        }

        .success-card .icon {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 12px;
            display: block;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .success-card h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--success-color);
            margin-bottom: 8px;
        }

        .success-card p {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 1rem;
            margin-bottom: 28px;
        }

        .success-card .btn-dashboard {
            display: inline-block;
            padding: 14px 36px;
            border: none;
            border-radius: 14px;
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 32px rgba(26, 58, 138, 0.15);
            position: relative;
            overflow: hidden;
        }

        .success-card .btn-dashboard::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.10), transparent);
            opacity: 0;
            transition: opacity 0.4s;
            border-radius: 14px;
        }

        .success-card .btn-dashboard:hover::after {
            opacity: 1;
        }

        .success-card .btn-dashboard:hover {
            background: var(--btn-hover);
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 12px 40px rgba(26, 58, 138, 0.25);
        }

        .success-card .btn-dashboard:active {
            transform: scale(0.96);
        }

        [data-theme="dark"] .success-card .btn-dashboard {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        [data-theme="dark"] .success-card .btn-dashboard:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .header {
                padding: 12px 20px;
            }
            .header-brand {
                font-size: 1rem;
                gap: 10px;
            }
            .header-brand .logo-icon {
                font-size: 1.3rem;
            }
            .header-brand .badge {
                font-size: 0.5rem;
                padding: 3px 12px;
            }
            .header-user {
                font-size: 0.75rem;
                padding: 4px 12px 4px 14px;
                gap: 8px;
            }
            .header-user .avatar {
                width: 28px;
                height: 28px;
                font-size: 0.7rem;
            }
            .theme-toggle {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
            .container {
                padding: 16px 14px 40px;
            }
            .success-card {
                padding: 32px 24px;
                border-radius: 20px;
            }
            .success-card .icon {
                font-size: 3.5rem;
            }
            .success-card h1 {
                font-size: 1.6rem;
            }
            .success-card p {
                font-size: 0.95rem;
            }
            .success-card .btn-dashboard {
                padding: 12px 28px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .success-card {
                padding: 24px 18px;
                border-radius: 18px;
            }
            .success-card .icon {
                font-size: 3rem;
            }
            .success-card h1 {
                font-size: 1.3rem;
            }
            .success-card p {
                font-size: 0.85rem;
            }
            .success-card .btn-dashboard {
                padding: 10px 24px;
                font-size: 0.9rem;
                width: 100%;
            }
        }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>

<body>

    <!-- ── Animated Background ── -->
    <div class="bg-canvas">
        <div class="gradient-orb"></div>
        <div class="gradient-orb"></div>
        <div class="gradient-orb"></div>
    </div>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-brand">
            <span class="logo-icon">🎓</span>
            University Portal
            <span class="badge">Student</span>
        </div>
        <div class="header-actions">
            <div class="header-user">
                <span class="avatar">👤</span>
                {{ student.user.get_full_name }}
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                <span id="themeIcon">🌙</span>
            </button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <div class="container">

        <div class="success-card">

            <span class="icon">✅</span>
            <h1>Password Changed Successfully</h1>
            <p>Aapka password successfully change ho gaya hai.</p>

            <a href="{% url 'student_dashboard' %}" class="btn-dashboard">
                Go to Dashboard →
            </a>

        </div>

    </div>

    <script>
        // ── Dark Mode Toggle ──
        (function() {
            const toggle = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const currentTheme = localStorage.getItem('theme') || 'light';

            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                icon.textContent = '☀️';
            } else {
                document.documentElement.removeAttribute('data-theme');
                icon.textContent = '🌙';
            }

            toggle.addEventListener('click', function() {
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                    icon.textContent = '🌙';
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                    icon.textContent = '☀️';
                }
                toggle.style.transform = 'scale(0.92)';
                setTimeout(() => {
                    toggle.style.transform = '';
                }, 200);
            });

            document.addEventListener('keydown', function(e) {
                if (e.altKey && e.key === 'd') {
                    e.preventDefault();
                    toggle.click();
                }
            });
        })();
    </script>

</body>

</html>
