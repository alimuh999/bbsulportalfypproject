<style>
    /* ── CSS Variables (Light & Dark) ── */
    :root {
        --ai-bg-primary: #f0f4fe;
        --ai-text-primary: #0b1a33;
        --ai-text-secondary: #2d4270;
        --ai-text-muted: #5a6f94;
        --ai-glass-bg: rgba(255, 255, 255, 0.65);
        --ai-glass-border: 1px solid rgba(255, 255, 255, 0.5);
        --ai-glass-shadow: 0 20px 60px rgba(11, 30, 74, 0.12);
        --ai-card-bg: rgba(255, 255, 255, 0.45);
        --ai-gradient-start: #1d4ed8;
        --ai-gradient-end: #6d28d9;
        --ai-btn-glow: rgba(37, 99, 235, 0.35);
        --ai-btn-glow-hover: rgba(37, 99, 235, 0.55);
        --ai-bubble-user: linear-gradient(135deg, #2563eb, #4f46e5);
        --ai-bubble-assistant-bg: rgba(255, 255, 255, 0.85);
        --ai-bubble-assistant-border: rgba(226, 232, 240, 0.6);
        --ai-input-bg: rgba(255, 255, 255, 0.7);
        --ai-input-border: rgba(203, 213, 225, 0.5);
        --ai-input-focus: #2563eb;
        --ai-typing-dot: #64748b;
        --ai-shadow: 0 25px 80px rgba(15, 23, 42, 0.20);
        --ai-bg-messages: rgba(248, 250, 252, 0.5);
    }

    [data-theme="dark"] {
        --ai-bg-primary: #0a1225;
        --ai-text-primary: #e8edf9;
        --ai-text-secondary: #b0c4e8;
        --ai-text-muted: #7a8fb8;
        --ai-glass-bg: rgba(22, 34, 64, 0.75);
        --ai-glass-border: 1px solid rgba(255, 255, 255, 0.06);
        --ai-glass-shadow: 0 20px 60px rgba(0, 0, 0, 0.50);
        --ai-card-bg: rgba(22, 34, 64, 0.40);
        --ai-gradient-start: #1a3570;
        --ai-gradient-end: #4a2a8a;
        --ai-btn-glow: rgba(37, 99, 235, 0.25);
        --ai-btn-glow-hover: rgba(37, 99, 235, 0.45);
        --ai-bubble-user: linear-gradient(135deg, #3a6cdb, #6a4ad6);
        --ai-bubble-assistant-bg: rgba(30, 46, 76, 0.85);
        --ai-bubble-assistant-border: rgba(255, 255, 255, 0.06);
        --ai-input-bg: rgba(255, 255, 255, 0.06);
        --ai-input-border: rgba(255, 255, 255, 0.08);
        --ai-input-focus: #4a7cf7;
        --ai-typing-dot: #8a9fc9;
        --ai-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
        --ai-bg-messages: rgba(0, 0, 0, 0.15);
    }

    /* ── AI Button ── */
    #ai-assistant-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 62px;
        height: 62px;
        border: none;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--ai-gradient-start), var(--ai-gradient-end));
        color: white;
        font-size: 28px;
        cursor: pointer;
        box-shadow: 0 15px 40px var(--ai-btn-glow);
        z-index: 99999;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #ai-assistant-button:hover {
        transform: translateY(-4px) scale(1.06);
        box-shadow: 0 20px 50px var(--ai-btn-glow-hover);
    }

    #ai-assistant-button:active {
        transform: scale(0.94);
    }

    /* ── Chat Window ── */
    #ai-assistant-window {
        position: fixed;
        right: 24px;
        bottom: 98px;
        width: 390px;
        max-width: calc(100vw - 30px);
        height: 560px;
        max-height: calc(100vh - 130px);
        background: var(--ai-glass-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: var(--ai-glass-border);
        border-radius: 28px;
        box-shadow: var(--ai-glass-shadow);
        overflow: hidden;
        display: none;
        flex-direction: column;
        z-index: 99998;
        transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        opacity: 0;
        transform: translateY(15px) scale(0.97);
    }

    #ai-assistant-window.active {
        display: flex;
        opacity: 1;
        transform: translateY(0) scale(1);
    }

    /* ── Header ── */
    .ai-header {
        min-height: 72px;
        padding: 14px 20px;
        background: linear-gradient(135deg, var(--ai-gradient-start), var(--ai-gradient-end));
        color: white;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ai-header-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .ai-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ai-header-title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
        line-height: 1.2;
    }

    .ai-header-status {
        font-size: 11px;
        opacity: 0.8;
        margin-top: 2px;
        font-weight: 500;
        letter-spacing: 0.2px;
    }

    #ai-close-button {
        border: none;
        background: rgba(255, 255, 255, 0.10);
        color: white;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #ai-close-button:hover {
        background: rgba(255, 255, 255, 0.20);
        transform: rotate(90deg);
    }

    /* ── Messages ── */
    #ai-messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px 20px;
        background: var(--ai-bg-messages);
        backdrop-filter: blur(4px);
        scroll-behavior: smooth;
    }

    /* custom scrollbar */
    #ai-messages::-webkit-scrollbar {
        width: 4px;
    }
    #ai-messages::-webkit-scrollbar-track {
        background: transparent;
    }
    #ai-messages::-webkit-scrollbar-thumb {
        background: var(--ai-text-muted);
        border-radius: 10px;
    }
    #ai-messages::-webkit-scrollbar-thumb:hover {
        background: var(--ai-text-secondary);
    }

    .ai-message {
        display: flex;
        margin-bottom: 14px;
        animation: aiMessageIn 0.3s ease forwards;
        opacity: 0;
        transform: translateY(8px);
    }

    @keyframes aiMessageIn {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .ai-message.user {
        justify-content: flex-end;
    }

    .ai-message.assistant {
        justify-content: flex-start;
    }

    .ai-bubble {
        max-width: 84%;
        padding: 12px 16px;
        border-radius: 18px;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        transition: all 0.2s;
    }

    .ai-message.user .ai-bubble {
        background: var(--ai-bubble-user);
        color: white;
        border-bottom-right-radius: 5px;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.15);
    }

    .ai-message.assistant .ai-bubble {
        background: var(--ai-bubble-assistant-bg);
        color: var(--ai-text-primary);
        border: 1px solid var(--ai-bubble-assistant-border);
        border-bottom-left-radius: 5px;
        backdrop-filter: blur(4px);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
    }

    /* ── Typing ── */
    .ai-typing {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 4px 0;
    }

    .ai-typing span {
        width: 7px;
        height: 7px;
        background: var(--ai-typing-dot);
        border-radius: 50%;
        animation: aiTyping 1.4s infinite ease-in-out;
    }

    .ai-typing span:nth-child(2) {
        animation-delay: 0.2s;
    }
    .ai-typing span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes aiTyping {
        0%, 60%, 100% {
            transform: translateY(0) scale(0.8);
            opacity: 0.4;
        }
        30% {
            transform: translateY(-6px) scale(1);
            opacity: 1;
        }
    }

    /* ── Input Area ── */
    .ai-input-area {
        padding: 12px 16px 16px 16px;
        background: var(--ai-glass-bg);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--ai-glass-border);
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-shrink: 0;
    }

    #ai-message-input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--ai-input-border);
        border-radius: 16px;
        padding: 10px 14px;
        font-size: 13px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        outline: none;
        resize: none;
        background: var(--ai-input-bg);
        color: var(--ai-text-primary);
        transition: all 0.25s ease;
        line-height: 1.5;
        max-height: 120px;
    }

    #ai-message-input:focus {
        border-color: var(--ai-input-focus);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
        background: var(--ai-input-bg);
    }

    #ai-message-input::placeholder {
        color: var(--ai-text-muted);
        opacity: 0.6;
    }

    #ai-send-button {
        width: 44px;
        height: 44px;
        border: none;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--ai-gradient-start), var(--ai-gradient-end));
        color: white;
        cursor: pointer;
        font-size: 18px;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 8px 20px rgba(37, 99, 235, 0.20);
        border: 1px solid rgba(255, 255, 255, 0.06);
    }

    #ai-send-button:hover:not(:disabled) {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.30);
    }

    #ai-send-button:active:not(:disabled) {
        transform: scale(0.94);
    }

    #ai-send-button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }

    /* ── Mobile ── */
    @media (max-width: 520px) {
        #ai-assistant-button {
            right: 16px;
            bottom: 16px;
            width: 56px;
            height: 56px;
            font-size: 24px;
        }

        #ai-assistant-window {
            right: 10px;
            bottom: 84px;
            width: calc(100vw - 20px);
            height: calc(100vh - 105px);
            border-radius: 22px;
        }

        .ai-header {
            padding: 12px 16px;
            min-height: 64px;
        }

        .ai-avatar {
            width: 38px;
            height: 38px;
            font-size: 18px;
        }

        .ai-header-title {
            font-size: 14px;
        }

        #ai-messages {
            padding: 14px 16px;
        }

        .ai-bubble {
            font-size: 12px;
            padding: 10px 14px;
        }

        .ai-input-area {
            padding: 10px 12px 14px 12px;
            gap: 8px;
        }

        #ai-message-input {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 14px;
        }

        #ai-send-button {
            width: 38px;
            height: 38px;
            font-size: 16px;
            border-radius: 14px;
        }
    }
</style>

<!-- =====================================================
     AI BUTTON
     ===================================================== -->

<button
    id="ai-assistant-button"
    type="button"
    aria-label="Open AI Assistant"
>
    🤖
</button>

<!-- =====================================================
     AI WINDOW
     ===================================================== -->

<div
    id="ai-assistant-window"
>

    <!-- HEADER -->
    <div class="ai-header">
        <div class="ai-header-left">
            <div class="ai-avatar">🤖</div>
            <div>
                <div class="ai-header-title">University AI Assistant</div>
                <div class="ai-header-status">Your personal portal assistant</div>
            </div>
        </div>

        <button
            id="ai-close-button"
            type="button"
            aria-label="Close AI Assistant"
        >
            ✕
        </button>
    </div>

    <!-- MESSAGES -->
    <div id="ai-messages">
        <div class="ai-message assistant">
            <div class="ai-bubble">
                Hi! 👋 I’m your University AI Assistant.
                Ask me about your results, subjects,
                fees, exam forms, leaves, gate passes,
                marksheets or degree clearance.
            </div>
        </div>
    </div>

    <!-- INPUT -->
    <div class="ai-input-area">
        <textarea
            id="ai-message-input"
            rows="1"
            placeholder="Ask about your portal..."
        ></textarea>

        <button
            id="ai-send-button"
            type="button"
            aria-label="Send message"
        >
            ➤
        </button>
    </div>

</div>

<script>
    (function () {

        const openButton = document.getElementById("ai-assistant-button");
        const closeButton = document.getElementById("ai-close-button");
        const windowElement = document.getElementById("ai-assistant-window");
        const messagesElement = document.getElementById("ai-messages");
        const inputElement = document.getElementById("ai-message-input");
        const sendButton = document.getElementById("ai-send-button");

        /* =====================================================
           OPEN
           ===================================================== */

        openButton.addEventListener("click", function () {
            windowElement.classList.add("active");
            setTimeout(function () {
                inputElement.focus();
            }, 150);
        });

        /* =====================================================
           CLOSE
           ===================================================== */

        closeButton.addEventListener("click", function () {
            windowElement.classList.remove("active");
        });

        /* =====================================================
           CSRF
           ===================================================== */

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        /* =====================================================
           ADD MESSAGE
           ===================================================== */

        function addMessage(text, type) {
            const wrapper = document.createElement("div");
            wrapper.className = "ai-message " + type;

            const bubble = document.createElement("div");
            bubble.className = "ai-bubble";
            bubble.textContent = text;

            wrapper.appendChild(bubble);
            messagesElement.appendChild(wrapper);
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }

        /* =====================================================
           TYPING
           ===================================================== */

        function showTyping() {
            const wrapper = document.createElement("div");
            wrapper.className = "ai-message assistant";
            wrapper.id = "ai-typing-message";

            const bubble = document.createElement("div");
            bubble.className = "ai-bubble";
            bubble.innerHTML = `
                <div class="ai-typing">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;

            wrapper.appendChild(bubble);
            messagesElement.appendChild(wrapper);
            messagesElement.scrollTop = messagesElement.scrollHeight;
        }

        function removeTyping() {
            const typing = document.getElementById("ai-typing-message");
            if (typing) typing.remove();
        }

        /* =====================================================
           SEND MESSAGE
           ===================================================== */

        async function sendMessage() {
            const message = inputElement.value.trim();
            if (!message) return;

            addMessage(message, "user");
            inputElement.value = "";
            inputElement.style.height = "auto";

            sendButton.disabled = true;
            inputElement.disabled = true;

            showTyping();

            const formData = new FormData();
            formData.append("message", message);

            try {
                const response = await fetch("/assistant/chat/", {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: formData,
                    credentials: "same-origin"
                });

                const data = await response.json();
                removeTyping();

                if (data.success) {
                    addMessage(data.answer, "assistant");
                } else {
                    addMessage(data.error || "Something went wrong.", "assistant");
                }
            } catch (error) {
                removeTyping();
                addMessage("AI Assistant se connection nahi ho saka. Please try again.", "assistant");
            } finally {
                sendButton.disabled = false;
                inputElement.disabled = false;
                inputElement.focus();
            }
        }

        /* =====================================================
           EVENT LISTENERS
           ===================================================== */

        sendButton.addEventListener("click", sendMessage);

        inputElement.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        inputElement.addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });

    })();
</script>
